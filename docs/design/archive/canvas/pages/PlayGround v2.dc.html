*{box-sizing:border-box}
body{margin:0;background:#F6F7F9;color:#0F172A;font-family:"Pretendard Variable",Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;word-break:keep-all}

button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#94A3B8}
::selection{background:#DBEAFE;color:#0F172A}
a:focus-visible,button:focus-visible{outline:2px solid #2563EB;outline-offset:2px}

  renderVals() {
    const showStatsNav = true;
    const s = this.state;
    const sortDefs = [{ name: "인기", w: 62 }, { name: "신규", w: 62 }, { name: "플레이순", w: 84 }];
    let acc = 0;
    const offsets = sortDefs.map(d => { const o = acc; acc += d.w; return o; });
    const sortIdx = Math.max(0, sortDefs.findIndex(d => d.name === s.sort));
    const sorts = sortDefs.map(d => ({
      name: d.name,
      w: d.w + "px",
      go: () => this.setState({ sort: d.name }),
      fg: d.name === s.sort ? "#0F172A" : "#64748B"
    }));

    const tagOf = label => {
      const st = s.tagState[label];
      const hv = s.hoverChip === "tag:" + label;
      return {
        label: "#" + label,
        enter: () => this.setState({ hoverChip: "tag:" + label }),
        leave: () => this.setState({ hoverChip: null }),
        go: () => this.setState(prev => {
          const next = { ...prev.tagState };
          if (!next[label]) next[label] = "in";
          else if (next[label] === "in") next[label] = "ex";
          else delete next[label];
          return { tagState: next };
        }),
        bg: st === "in" ? (hv ? "#1E293B" : "#0F172A") : (hv ? "#F1F3F5" : "transparent"),
        fg: st === "in" ? "#FFFFFF" : st === "ex" ? "#64748B" : hv ? "#0F172A" : "#64748B",
        ring: st === "ex" ? "1px solid #94A3B8" : "1px solid transparent",
        deco: st === "ex" ? "line-through" : "none",
        cls: st === "in" ? "pfTagIn" : st === "ex" ? "pfTagEx" : "pfTag",
        weight: st ? 500 : 400
      };
    };
    const axis = (key, defs) => defs.map(d => {
      const on = s[key] === d.value, hv = s.hoverChip === key + ":" + d.value;
      return {
        name: d.name,
        go: () => this.setState({ [key]: d.value }),
        enter: () => this.setState({ hoverChip: key + ":" + d.value }),
        leave: () => this.setState({ hoverChip: null }),
        bg: on ? (hv ? "#1E293B" : "#0F172A") : hv ? "#F1F3F5" : "transparent",
        fg: on ? "#FFFFFF" : hv ? "#0F172A" : "#64748B",
        weight: on ? 600 : 500
      };
    });
    const modeOpts = axis("mode", [
      { name: "전체", value: "전체" },
      { name: "싱글", value: "싱글플레이" },
      { name: "멀티", value: "멀티플레이" }
    ]);
    const runOpts = axis("runtime", [
      { name: "전체", value: "전체" },
      { name: "브라우저", value: "브라우저 실행" },
      { name: "PC", value: "PC 다운로드" },
      { name: "모바일", value: "모바일" }
    ]);
    const themeNames = this.allTags.filter(t => !["싱글플레이", "멀티플레이", "브라우저 실행", "PC 다운로드", "모바일"].includes(t));
    const tagsTheme = themeNames.map(tagOf);

    const needle = s.q.replace(/[\u1100-\u11FF\u3130-\u318F\uA960-\uA97F\uD7B0-\uD7FF]/g, "").trim().toLowerCase();
    const inc = Object.keys(s.tagState).filter(k => s.tagState[k] === "in");
    const exc = Object.keys(s.tagState).filter(k => s.tagState[k] === "ex");
    const match = g =>
      (s.mode === "전체" || g.tags.includes(s.mode)) &&
      (s.runtime === "전체" || g.tags.includes(s.runtime)) &&
      inc.every(t => g.tags.includes(t)) &&
      !exc.some(t => g.tags.includes(t)) &&
      (!needle || g.title.toLowerCase().includes(needle) ||
        g.dev.toLowerCase().includes(needle) || g.tags.some(t => t.includes(needle)));

    const key = s.sort === "신규" ? (a, b) => a.days - b.days
      : s.sort === "플레이순" ? (a, b) => b.plays - a.plays
      : (a, b) => b.trend - a.trend;

    const visible = this.games.filter(match).sort(key).map((g, n) => {
      const saved = s.favs.includes(g.i);
      return {
        ...this.paint(g),
        chips: g.tags.slice(0, 3).map(t => ({ text: "#" + t })),
        ratingLabel: (3.5 + (g.trend / 100) * 1.4).toFixed(1),
        reviewLabel: Component.fmt(Math.round(g.plays / 720)),
        marks: (mk => mk.playerMarks.concat(mk.runMarks))(this.marksOf(g)),
        delay: (n % 8) * 45 + "ms",
        inLibrary: s.signedIn && saved,
        playedBefore: g.i < 8 && !(s.signedIn && saved),
        favLabel: saved ? "저장됨" : "저장",
        favColor: saved ? "#2563EB" : "#94A3B8",
        favBg: saved ? "#EFF6FF" : "#FFFFFF",
        favBd: saved ? "#DBEAFE" : "#E2E8F0",
        toggleFav: () => this.toggleFav(g.i)
      };
    });

    const recentList = this.games.slice().sort((a, b) => a.days - b.days).slice(0, 8).map(g => ({
      ...this.paint(g),
      slot: g.recentSlot,
      achLabel: g.achDone + " / " + g.achTotal,
      achPct: Math.round((g.achDone / g.achTotal) * 100) + "%"
    }));
    const step = 248;
    const maxIdx = Math.max(0, recentList.length - 5);

    const palettes = ["#2563EB", "#8949FF", "#008638"].map(accent => ({ accent }));
    const badges = this.achievements.map((a, i) => ({
      name: a.name,
      delay: i * 60 + "ms",
      bg: a.on ? palettes[i % 3].accent : "#F1F3F5",
      bd: a.on ? palettes[i % 3].accent : "#E2E8F0",
      fg: a.on ? "#FFFFFF" : "#CBD5E1"
    }));
    const idx = Math.min(s.recent, maxIdx);

    const libSorts = ["최근 플레이", "가나다"].map(name => ({
      name,
      go: () => this.setState({ libSort: name }),
      weight: name === s.libSort ? 700 : 500,
      fg: name === s.libSort ? "#0F172A" : "#94A3B8"
    }));

    const favOrder = s.libSort === "가나다"
      ? (a, b) => a.title.localeCompare(b.title, "ko")
      : (a, b) => a.lastDays - b.lastDays;

    const byTime = s.favs.map(i => this.games[i]).filter(Boolean).slice().sort((a, b) => b.mins - a.mins).map(g => g.i);

    const favs = s.favs.map(i => this.games[i]).filter(Boolean).sort(favOrder).map(g => {
      const pct = Math.round((g.achDone / g.achTotal) * 100);
      const d = new Date(2026, 7, 25 - g.lastDays);
      const rank = byTime.indexOf(g.i);
      const badges = [];
      if (rank < 3) badges.push({ label: (rank + 1) + "위", bg: ["#0F172A", "#94A3B8", "#94A3B8"][rank], tip: "플레이타임 " + (rank + 1) + "위" });
      if (g.achDone === g.achTotal) badges.push({ label: "완", bg: "#8949FF", tip: "도전과제 전체 달성" });
      if (g.mins >= 600) badges.push({ label: "10h", bg: "#2563EB", tip: "10시간 이상 플레이" });
      if (g.i % 3 === 0) badges.push({ label: "7d", bg: "#008638", tip: "7일 연속 플레이" });
      return {
        ...this.paint(g),
        badges,
        playHours: Component.dur(g.mins),
        recentHours: Component.dur(Math.max(15, Math.round(g.mins * 0.22))),
        lastPlayed: g.lastDays === 0 ? "오늘" : g.lastDays === 1 ? "어제" : g.lastDays + "일 전",
        lastDate: (d.getMonth() + 1) + "월 " + d.getDate() + "일",
        achLabel: g.achDone + " / " + g.achTotal,
        achPct: pct + "%",
        achPctLabel: pct + "% 달성",
        toggleFav: () => this.toggleFav(g.i)
      };
    });

    const spot = this.spots[s.spot];
    const spAccent = this.accentOf(spot.title);
    const sp = { accent: spAccent, glow: Component.rgba(spAccent, 0.45) };
    const rotating = this.props.autoRotateSpotlight !== false;

    const unreadOf = name => this.feeds[name].items.filter((it, i) => !s.notifHidden[name + "|" + i] && !s.notifRead[name + "|" + i]).length;
    const notifs = this.feeds[s.feed].items
      .map((it, i) => ({ it, key: s.feed + "|" + i }))
      .filter(x => !s.notifHidden[x.key])
      .map(({ it, key }) => {
        const read = !!s.notifRead[key];
        return {
          ...it,
          dot: read ? "#E2E8F0" : it.dot,
          weight: read ? 500 : 600,
          titleColor: read ? "#94A3B8" : "#0F172A",
          metaColor: read ? "#CBD5E1" : "#94A3B8",
          whenColor: read ? "#E2E8F0" : "#CBD5E1",
          open: () => this.setState(st => ({ notifRead: { ...st.notifRead, [key]: true } })),
          remove: e => {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            this.setState(st => ({ notifHidden: { ...st.notifHidden, [key]: true } }));
          }
        };
      });

    return {
      sorts, modeOpts, runOpts, tagsTheme, visible, badges, libSorts, showStatsNav,
      pickHoldOn: () => this.setState({ pickHold: true }),
      pickHoldOff: () => { this.setState({ pickHold: false }); this.startPickTimer(); },
      pick: { ...this.pickData[s.pick], initial: this.pickData[s.pick].dev.slice(0, 1), devColor: this.accentOf(this.pickData[s.pick].dev) },
      pickSlides: this.pickData.map((x, i) => ({ slot: x.slot, title: x.short, art: this.artFor(x.short), op: i === s.pick ? 1 : 0, z: i === s.pick ? 2 : 1 })),
      pickCards: this.pickData.map((x, i) => ({
        ...x,
        art: this.artFor(x.short),
        stats: x.stats.map((t, j) => ({ ...t, pad: j === 0 ? "0 8px 0 0" : j === 1 ? "0 8px" : "0 0 0 8px" })),
        op: i === s.pick ? 1 : .4,
        shadow: i === s.pick ? "0 0 16px 0 rgba(0,0,0,.16)" : "none",

        zoom: i === s.pick ? 1.06 : 1,
        enter: () => this.setState({ pick: i, pickHold: true }),
        leave: () => { this.setState({ pickHold: false }); this.startPickTimer(); }
      })),
      ...Object.keys(this.feeds).reduce((acc, name, i) => {
        const d = this.feeds[name], on = s.feed === name;
        acc["f" + i] = {
          go: () => this.setState({ feed: name }),
          tip: d.tip,
          bg: on ? "#EFF6FF" : "#F6F7F9",
          bd: on ? "#2563EB" : "#F6F7F9",
          fg: on ? "#2563EB" : "#94A3B8",
          ic: on ? "#2563EB" : "#94A3B8",
          badge: unreadOf(name),
          hasBadge: unreadOf(name) > 0
        };
        return acc;
      }, {}),
      feedTitle: this.feeds[s.feed].title,
      feedItems: notifs,
      markAllRead: () => this.setState(st => {
        const next = { ...st.notifRead };
        this.feeds[st.feed].items.forEach((it, i) => { next[st.feed + "|" + i] = true; });
        return { notifRead: next };
      }),
      feedLink: true,
      feedLinkLabel: s.feed === "공지" ? "전체 공지 보러가기" : "더 보기",
      allTagCls: Object.keys(s.tagState).length ? "pfTag" : "pfTagIn",
      allTagEnter: () => this.setState({ hoverChip: "tag:__all" }),
      allTagLeave: () => this.setState({ hoverChip: null }),
      allTagBg: Object.keys(s.tagState).length ? (s.hoverChip === "tag:__all" ? "#F1F3F5" : "transparent") : (s.hoverChip === "tag:__all" ? "#1E293B" : "#0F172A"),
      allTagFg: Object.keys(s.tagState).length ? (s.hoverChip === "tag:__all" ? "#0F172A" : "#64748B") : "#FFFFFF",
      allTagWeight: Object.keys(s.tagState).length ? 400 : 500,
      badgeGhosts: badges.slice(0, 6),
      slides: this.spots.map((x, i) => ({
        ...x,
        op: i === s.spot ? 1 : 0,
        z: i === s.spot ? 2 : 1,
        wash: Component.rgba(this.accentOf(x.title), 0.1),
        art: this.artFor(x.title)
      })),
      spot: { ...spot, accent: sp.accent, glow: sp.glow },
      heroAnim: "pfHero" + ["A", "B", "C"][s.spot] + " .6s cubic-bezier(.2,.7,.2,1) both",
      barAnim: rotating ? "pfBar" + s.spot + " 7s linear both" : "none",
      dots: this.spots.map((_, i) => ({
        go: () => this.setState({ spot: i }),
        w: i === s.spot ? "24px" : "5px",
        bg: i === s.spot ? sp.accent : "#CBD5E1"
      })),
      slideCounter: "0" + (s.spot + 1) + " / 0" + this.spots.length,
      prevSlide: () => this.setState(st => ({ spot: (st.spot + 2) % 3 })),
      nextSlide: () => this.setState(st => ({ spot: (st.spot + 1) % 3 })),
      recent: recentList,
      recentX: "-" + idx * step + "px",
      prevRecent: () => this.setState(st => ({ recent: Math.max(0, st.recent - 1) })),
      nextRecent: () => this.setState(st => ({ recent: Math.min(maxIdx, st.recent + 1) })),
      fresh: this.games.filter(g => g.days <= 14).sort((a, b) => a.days - b.days).slice(0, 4)
        .map((g, n) => ({
          ...this.paint(g),
          delay: n * 70 + "ms",
          chips: g.tags.slice(0, 3).map(t => ({ text: "#" + t })),
        ratingLabel: (3.5 + (g.trend / 100) * 1.4).toFixed(1),
        reviewLabel: Component.fmt(Math.round(g.plays / 720)),
        marks: (mk => mk.playerMarks.concat(mk.runMarks))(this.marksOf(g)),
          inLibrary: s.signedIn && s.favs.includes(g.i),
          playedBefore: g.i < 8 && !(s.signedIn && s.favs.includes(g.i))
        })),
      sortW: sortDefs[sortIdx].w + "px",
      sortX: offsets[sortIdx] + "px",
      totalPlayers: (12480).toLocaleString("ko-KR"),
      totalPlays: Component.fmt(this.games.reduce((a, g) => a + g.plays, 0)) + "회",
      q: s.q,
      onSearch: e => this.setState({ q: e.target.value }),
      email: s.email,
      onEmail: e => this.setState({ email: e.target.value }),
      signIn: () => this.setState(st => ({ signedIn: true, favs: st.favs.length ? st.favs : [0, 2, 4, 6, 8, 10] })),
      signOut: () => this.setState({ signedIn: false }),
      showFavs: () => { if (this.favEl) window.scrollTo({ top: this.favEl.offsetTop - 90, behavior: "smooth" }); },
      asideH: s.signedIn ? "600px" : "auto",
      guest: !s.signedIn,
      signedIn: s.signedIn,
      favs,
      favCount: s.favs.length,
      libCount: "게임 " + favs.length + "개",
      libTotal: Component.dur(favs.reduce((a, g) => a + g.mins, 0)),
      libAch: favs.reduce((a, g) => a + g.achDone, 0) + " / " + favs.reduce((a, g) => a + g.achTotal, 0),
      hasFavs: s.signedIn && favs.length > 0,
      emptyFavs: s.signedIn && favs.length === 0,
      favSubtitle: s.signedIn ? "저장한 게임 " + favs.length + "개" : "게스트도 둘러볼 수 있어요 — 저장은 로그인 후",
      reset: () => this.setState({ q: "", tagState: {}, mode: "전체", runtime: "전체" }),
      hasFilters: inc.length + exc.length > 0,
      hasTags: inc.length + exc.length > 0,
      clearTags: () => this.setState({ tagState: {} }),
      headline: "게임 둘러보기",
      countLabel: visible.length + "개 타이틀",
      isEmpty: visible.length === 0,
      showPlays: this.props.showPlayCounts !== false,
      gridRef: el => { this.gridEl = el; this.applyCols(); },
      favRef: el => { this.favEl = el; }
    };
  }
}
</script>
</body>
</html>
