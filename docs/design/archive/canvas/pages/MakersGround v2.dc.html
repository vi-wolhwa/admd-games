  popularOrder() {
    if (this._pop) return this._pop;
    const d = this.rankingData;
    const rankBy = key => new Map(d.slice().sort((a, b) => b[key] - a[key]).map((x, n) => [x.title, n + 1]));
    const rv = rankBy("views"), ru = rankBy("votes"), rc = rankBy("comments");
    this._pop = d.slice()
      .map(x => ({ ...x, popScore: rv.get(x.title) + ru.get(x.title) + rc.get(x.title) }))
      .sort((a, b) => a.popScore - b.popScore || b.views - a.views);
    return this._pop;
  }

  questionPage() {

    const d = this.openQuestionsData;
    return Array.from({ length: 4 }, (_, i) => d[(p + i) % d.length]);
  }

  hotSlice() {
    const p = this.state.hotPage * 5;

  static clip(s, n) {
    return s.length > n ? s.slice(0, n).replace(/[\s·,.]+$/, "") + "…" : s;
  }

  static dowOf(y, m, d) {
    return ["일", "월", "화", "수", "목", "금", "토"][new Date(y, m - 1, d).getDay()];
  }


  static avatarColor(name) {
    const palette = ["#0F172A"];
    let h = 0;
    for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) % 9973;
    return palette[h % palette.length];
  }

  static interleave(a, b) {
    const out = [];
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      if (a[i]) out.push(a[i]);
      if (b[i]) out.push(b[i]);
    }
    return out;
  }

  static padRows(items, slots) {
    const out = items.slice(0, slots).map(x => ({
      leadSub: "", value: "", titleColor: "#0F172A", leadColor: "#64748B", href: "#", pointer: "auto", ...x
    }));
    while (out.length < slots) {
      out.push({ lead: "", leadSub: "", title: "", sub: "", value: "", leadColor: "#64748B", titleColor: "#0F172A", href: "#", pointer: "none" });
    }
    return out;
  }
