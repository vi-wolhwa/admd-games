<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
<div style="display:flex;align-items:baseline;gap:8px;line-height:1.15">
<dc-import name="Display" as="span" size="md" hint-size="120px,42px">{{ count }}</dc-import>
<dc-import name="Body" as="span" size="xs" weight="semibold" color="secondary" hint-size="120px,18px">{{ prefix }}<span style="font-weight:700;color:{{ accent }}">{{ highlight }}</span>{{ suffix }}</dc-import>
</div>
<div style="margin-top:7px;display:flex;align-items:center;gap:6px">
<dc-import name="Body" as="span" size="xs" weight="bold" sx="flex:none;padding:2px 7px;background:#F1F3F5;color:#475569" hint-size="120px,18px">{{ chip }}</dc-import>
<dc-import name="Body" as="span" size="xs" color="tertiary" sx="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" hint-size="120px,18px">{{ note }}</dc-import>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:90},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;428&quot;,&quot;tsType&quot;:&quot;string | number&quot;},&quot;prefix&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;건의 새 글이 &quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;highlight&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;주목&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;suffix&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;받습니다&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;chip&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;최근 7일&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;인기순 · 오늘 14:20 갱신&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#EA580C&quot;,&quot;options&quot;:[&quot;#EA580C&quot;,&quot;#0F172A&quot;,&quot;#008638&quot;],&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
