<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;grid-template-columns:112px minmax(0,1fr);gap:24px">
<div style="background:#FFFFFF;padding:14px 16px;display:flex;flex-direction:column;justify-content:center">
<dc-import name="Body" as="span" size="xs" weight="bold" color="secondary" sx="letter-spacing:.06em" hint-size="120px,18px">{{ label }}</dc-import>
<dc-import name="Body" as="span" size="xs" color="tertiary" sx="margin-top:5px" hint-size="120px,18px">{{ range }}</dc-import>
</div>
<div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;background:#F1F3F5">
<sc-for list="{{ days }}" as="c" hint-placeholder-count="8">
<div style="background:{{ c.bg }};padding:12px 12px 13px;display:flex;flex-direction:column">
<div style="display:flex;align-items:baseline;gap:5px">
<dc-import name="Body" as="div" weight="bold" size="md" tabular="{{ true }}" sx="display:inline;color:{{ c.dayColor }}" hint-size="160px,24px">{{ c.day }}</dc-import>
<dc-import name="Body" as="span" size="xs" weight="semibold" sx="letter-spacing:.06em;color:{{ c.dowColor }}" hint-size="120px,18px">{{ c.dow }}</dc-import>
</div>
<dc-import name="Body" as="div" size="xs" sx="margin-top:9px;min-height:26px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:{{ c.evColor }}" hint-size="120px,18px">{{ c.event }}</dc-import>
</div>
</sc-for>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:90},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;이번 주 행사&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;range&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;8월 23 – 30&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;days&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;CalDay[]&quot;}}"></script>
</body>
</html>
