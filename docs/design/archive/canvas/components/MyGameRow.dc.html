<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes mrGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.mrRow{cursor:pointer;position:relative;transition:opacity 200ms cubic-bezier(.2,.7,.2,1),box-shadow 200ms cubic-bezier(.2,.7,.2,1)}
.mrRow:hover{z-index:2;box-shadow:0 0 16px 0 rgba(0,0,0,.16)}
.mrZoom{position:absolute;inset:0;transition:transform 320ms cubic-bezier(.2,.7,.2,1)}
.mrRow:hover .mrZoom{transform:scale(1.07)}
.mrTitle{transition:color 120ms cubic-bezier(.2,.7,.2,1)}
.mrRow:hover .mrTitle{color:var(--mr-acc,#EA580C)}
</style>
</helmet>

<a class="mrRow" style="--mr-acc:{{ accent }};flex:none;overflow:hidden;background:#FFFFFF;display:grid;grid-template-columns:minmax(0,1fr) auto 146px;gap:16px;align-items:stretch;height:118px;padding:16px 18px 16px 195px">
<div style="position:absolute;left:0;top:0;bottom:0;width:177px;z-index:0;overflow:hidden;background:#F1F3F5">
<div class="mrZoom"><image-slot id="{{ game.slot }}" shape="rect" placeholder=" "></image-slot></div>
<dc-import name="Body" as="span" size="xs" weight="bold" color="inverse" sx="position:absolute;left:0;top:0;z-index:4;padding:3px 7px;background:{{ game.stateBg }}" hint-size="120px,18px">{{ game.state }}</dc-import>
<span style="position:absolute;right:0;bottom:0;z-index:4;display:flex;align-items:baseline;gap:5px;padding:3px 7px;background:rgba(255,255,255,.94)">
<dc-import name="Body" as="span" size="xs" weight="bold" hint-size="120px,18px">{{ game.ver }}</dc-import>
<dc-import name="Body" as="span" size="xs" weight="medium" color="tertiary" hint-size="120px,18px">{{ game.updated }}</dc-import>
</span>
</div>
<div style="position:relative;z-index:3;min-width:0;display:flex;flex-direction:column;justify-content:space-between">
<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" class="mrTitle"><dc-import name="Headline" as="h3" size="xs" hint-size="180px,24px">{{ game.title }}</dc-import></div>
<div style="display:flex;align-items:center;gap:7px;min-width:0">
<dc-import name="Body" as="span" size="xs" weight="medium" color="tertiary" sx="flex:none" hint-size="120px,18px">{{ topTag }}</dc-import>
<span style="flex:none;width:3px;height:3px;border-radius:999px;background:#CBD5E1"></span>
<dc-import name="Body" as="span" size="xs" color="tertiary" sx="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" hint-size="120px,18px">{{ tagLine }}</dc-import>
</div>
<div style="display:flex;align-items:center;gap:8px">
<dc-import name="Body" as="span" size="xs" weight="bold" tabular="{{ true }}" hint-size="120px,18px">{{ game.plays }}</dc-import>
<dc-import name="Body" as="span" size="xs" color="tertiary" hint-size="120px,18px">플레이</dc-import>
<span style="width:3px;height:3px;border-radius:999px;background:#CBD5E1"></span>
<dc-import name="Body" as="span" size="xs" color="secondary" hint-size="120px,18px">리뷰 {{ game.reviews }}</dc-import>
<dc-import name="Body" as="span" size="xs" color="quaternary" hint-size="120px,18px">{{ game.updated }} 업데이트</dc-import>
</div>
</div>
<div style="position:relative;z-index:3;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;max-width:120px">
<dc-import name="Body" as="span" size="xs" weight="bold" tabular="{{ true }}" sx="color:#008638" hint-size="120px,18px">{{ game.growth }}</dc-import>
<sc-for list="{{ game.ranks }}" as="r" hint-placeholder-count="3">
<span style="display:flex;align-items:baseline;gap:6px">
<dc-import name="Body" as="span" size="xs" weight="semibold" color="tertiary" sx="letter-spacing:.06em" hint-size="120px,18px">{{ r.label }}</dc-import>
<dc-import name="Body" as="span" size="xs" weight="bold" tabular="{{ true }}" sx="color:{{ r.color }}" hint-size="120px,18px">{{ r.value }}</dc-import>
</span>
</sc-for>
</div>
<div style="position:relative;z-index:3;display:flex;flex-direction:column;justify-content:space-between">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
<dc-import name="Body" as="span" size="xs" weight="semibold" color="tertiary" sx="letter-spacing:.06em" hint-size="120px,18px">평점</dc-import>
<dc-import name="Body" as="span" size="xs" weight="bold" tabular="{{ true }}" sx="color:{{ game.ratingColor }}" hint-size="120px,18px">{{ game.rating }}</dc-import>
</div>
<div style="margin-top:7px;height:5px;background:#F1F3F5;overflow:hidden">
<div style="height:5px;width:{{ game.ratingBar }};background:{{ accent }};transform-origin:0 50%;animation:mrGrow 480ms cubic-bezier(.2,.7,.2,1) both"></div>
</div>
<dc-import name="Body" as="div" size="xs" color="tertiary" sx="margin-top:5px;text-align:right" hint-size="120px,18px">7일 재방문 {{ game.d7 }}</dc-import>
</div>
</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:150},&quot;game&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;StudioGame&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#EA580C&quot;,&quot;options&quot;:[&quot;#EA580C&quot;,&quot;#2563EB&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const g = this.props.game || {};
    const names = (g.tags || []).map(t => (typeof t === "string" ? t : t.name));
    return {
      accent: this.props.accent ?? "#EA580C",
      topTag: names.length ? "#" + names[0] : "",
      tagLine: names.slice(1).join(" · ")
    };
  }
}

</script>
</body>
</html>
