<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.ctField:has(input:focus-visible){outline:2px solid #2563EB;outline-offset:2px}
</style>
</helmet>

<div style="display:flex;align-items:center;gap:12px">
<label class="ctField" style="border:0;display:flex;align-items:center;gap:8px;width:268px;height:38px;padding:0 14px;border-radius:999px;background:#FFFFFF;transition:200ms" style-hover="border-color:#2563EB;background:#FFFFFF">
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" style="flex:none"><circle cx="6" cy="6" r="4.25"></circle><path d="M9.3 9.3 12.4 12.4"></path></svg>
<input type="text" value="{{ query }}" onChange="{{ onSearch }}" placeholder="{{ placeholder }}" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;line-height:1.5;letter-spacing:-.014em;color:#0F172A">
</label>
<div style="position:relative;display:flex;align-items:center;padding:3px;border-radius:999px;background:#F1F3F5;border:1px solid #E2E8F0">
<span style="position:absolute;top:3px;left:3px;height:30px;border-radius:999px;background:#FFFFFF;transition:transform 320ms cubic-bezier(.2,.7,.2,1),width 320ms cubic-bezier(.2,.7,.2,1);width:{{ thumbW }};transform:translateX({{ thumbX }})"></span>
<sc-for list="{{ sorts }}" as="s" hint-placeholder-count="3">
<button style="position:relative;z-index:1;border:0;background:transparent;height:30px;transition:color 200ms cubic-bezier(.2,.7,.2,1);width:{{ s.w }}" type="button" onClick="{{ s.go }}"><dc-import name="Body" as="span" size="xs" weight="semibold" hint-size="120px,18px">{{ s.name }}</dc-import></button>
</sc-for>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:60},&quot;query&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;게임, 제작자, 태그 검색&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSearch&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e) =&gt; void&quot;},&quot;sorts&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;SortOpt[]&quot;},&quot;thumbW&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;58px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;thumbX&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0px&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
