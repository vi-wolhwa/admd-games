<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.tpHero{transition:box-shadow 200ms cubic-bezier(.2,.7,.2,1)}
.tpHero:hover{box-shadow:0 0 16px 0 rgba(0,0,0,.16)}
.tpHero:active{box-shadow:0 0 16px 0 rgba(0,0,0,.16)}
.tpZoom{position:absolute;inset:0;transition:transform 320ms cubic-bezier(.2,.7,.2,1)}
.tpHero:hover .tpZoom{transform:scale(1.06)}
.tpLink span{transition:color 120ms cubic-bezier(.2,.7,.2,1)}
.tpLink:hover span{color:#2563EB!important}
</style>
</helmet>

<section style="width:1280px;margin:0 auto;padding:64px 0 0">
<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:20px;border-bottom:1px solid #E9ECF1">
<dc-import name="SectionHead" title="{{ title }}" subtitle="{{ subtitle }}" hint-size="420px,30px"></dc-import>
<a class="tpLink"><dc-import name="Body" as="span" size="sm" weight="semibold" hint-size="140px,21px">{{ linkLabel }}</dc-import></a>
</div>

<div style="display:grid;grid-template-columns:minmax(0,6fr) minmax(0,4fr);gap:24px;margin-top:22px;min-height:568px">

<a class="tpHero" onMouseEnter="{{ onHoldOn }}" onMouseLeave="{{ onHoldOff }}" style="display:flex;flex-direction:column;background:#FFFFFF">
<div style="position:relative;flex:1;min-height:0;background:#F1F3F5;overflow:hidden">
<sc-for list="{{ slides }}" as="s" hint-placeholder-count="1">
<div style="position:absolute;inset:0;opacity:{{ s.op }};z-index:{{ s.z }};transition:opacity 480ms cubic-bezier(.2,.7,.2,1)">
<div class="tpZoom" style="height:100%"><div style="position:absolute;inset:0;background-image:url('{{ s.art }}');background-size:cover;background-position:center"></div></div>
</div>
</sc-for>
<dc-import name="Body" as="span" size="xs" weight="bold" color="inverse" sx="position:absolute;top:0;left:0;z-index:5;padding:6px 12px;background:{{ pick.badgeBg }};transition:background 320ms cubic-bezier(.2,.7,.2,1);letter-spacing:.06em" hint-size="120px,18px">{{ pick.badge }}</dc-import>
</div>
<div style="flex:none;padding:20px 24px 22px;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;gap:6px">
<dc-import name="Body" as="span" size="xs" weight="bold" color="inverse" sx="width:20px;height:20px;border-radius:999px;background:{{ pick.devColor }};display:grid;place-items:center" hint-size="120px,18px">{{ pick.initial }}</dc-import>
<dc-import name="Body" as="span" size="xs" weight="bold" hint-size="120px,18px">{{ pick.dev }}</dc-import>
</span>
<sc-for list="{{ pick.chips }}" as="c" hint-placeholder-count="4">
<dc-import name="Body" as="span" size="xs" weight="bold" sx="padding:2px 8px;background:{{ c.bg }};color:{{ c.fg }}" hint-size="120px,18px">{{ c.text }}</dc-import>
</sc-for>
</div>
<dc-import name="Headline" as="h2" size="sm" sx="margin-top:9px;text-wrap:balance" hint-size="220px,31px">{{ pick.title }}</dc-import>
<dc-import name="Body" as="p" size="sm" color="body" sx="margin:9px 0 0;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden" hint-size="140px,21px">{{ pick.desc }}</dc-import>
<div style="margin-top:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px">
<div style="display:flex;gap:26px">
<sc-for list="{{ pick.stats }}" as="t" hint-placeholder-count="3">
<div>
<dc-import name="Display" as="span" size="sm" tabular="{{ true }}" sx="color:{{ t.color }}" hint-size="90px,34px">{{ t.value }}</dc-import>
<dc-import name="Body" as="div" size="xs" color="tertiary" sx="margin-top:3px" hint-size="120px,18px">{{ t.label }}</dc-import>
</div>
</sc-for>
</div>
<div style="flex:none;display:flex;gap:8px">
<span style="width:110px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:#0F172A;white-space:nowrap;transition:background 200ms cubic-bezier(.2,.7,.2,1)" style-hover="background:#2563EB"><dc-import name="Body" as="span" size="sm" weight="bold" color="inverse" hint-size="140px,21px">{{ pick.cta }}</dc-import></span>
<span style="width:110px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid #0F172A;white-space:nowrap;transition:box-shadow 200ms cubic-bezier(.2,.7,.2,1),color 200ms cubic-bezier(.2,.7,.2,1)" style-hover="box-shadow:inset 0 0 0 1px #2563EB;color:#2563EB"><dc-import name="Body" as="span" size="sm" weight="bold" hint-size="140px,21px">{{ pick.listCta }}</dc-import></span>
</div>
</div>
</div>
</a>

<div style="display:grid;grid-template-rows:repeat(5,minmax(96px,1fr));gap:10px">
<sc-for list="{{ cards }}" as="c" hint-placeholder-count="5">
<div style="min-height:0;display:flex;flex-direction:column">
<dc-import name="PickCard" card="{{ c }}" hint-size="100%,100%"></dc-import>
</div>
</sc-for>
</div>

</div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:700},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;지금 플레이할 게임&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;이번 주 왕좌부터 숨은 보석까지&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;linkLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;카탈로그 전체 보기 →&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slides&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Slide[]&quot;},&quot;pick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Pick&quot;},&quot;cards&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;PickCard[]&quot;},&quot;onHoldOn&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onHoldOff&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
