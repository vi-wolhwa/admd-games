<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.smMark{position:relative;display:inline-flex;align-items:center}
.smTip{position:absolute;bottom:calc(100% + 9px);right:-8px;padding:6px 10px;background:#FFFFFF;color:#0F172A;font-size:12px;line-height:1.5;font-weight:600;letter-spacing:-.008em;white-space:nowrap;box-shadow:0 0 16px 0 rgba(0,0,0,.16);opacity:0;transform:translateY(4px);transition:opacity 200ms cubic-bezier(.2,.7,.2,1),transform 200ms cubic-bezier(.2,.7,.2,1);pointer-events:none;z-index:20}
.smMark:hover .smTip{opacity:1;transform:translateY(0)}
</style>
</helmet>

<span style="flex:none;display:flex;align-items:center;gap:{{ gap }}">
<sc-for list="{{ marks }}" as="mk" hint-placeholder-count="3">
<span class="smMark" style="flex:none;display:grid;place-items:center;width:{{ size }};height:{{ size }}">
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 16 16" fill="{{ mk.fill }}" stroke="{{ stroke }}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
<sc-for list="{{ mk.paths }}" as="pp" hint-placeholder-count="1"><path d="{{ pp.d }}"></path></sc-for>
</svg>
<span class="smTip">{{ mk.tip }}</span>
</span>
</sc-for>
</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:40},&quot;marks&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Mark[]&quot;,&quot;default&quot;:[{&quot;tip&quot;:&quot;싱글 플레이&quot;,&quot;fill&quot;:&quot;#94A3B8&quot;,&quot;paths&quot;:[{&quot;d&quot;:&quot;M8 5.7a2.3 2.3 0 1 0 0 4.6a2.3 2.3 0 1 0 0-4.6&quot;}]},{&quot;tip&quot;:&quot;브라우저에서 바로 실행&quot;,&quot;fill&quot;:&quot;none&quot;,&quot;paths&quot;:[{&quot;d&quot;:&quot;M2.2 3.8h11.6v8.4H2.2z&quot;},{&quot;d&quot;:&quot;M2.2 6.3h11.6&quot;}]}]},&quot;size&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;15px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;gap&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stroke&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#94A3B8&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#94A3B8&quot;,&quot;#64748B&quot;,&quot;#0F172A&quot;]}}"></script>
</body>
</html>
