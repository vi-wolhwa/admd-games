<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes pfHeroA{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pfHeroB{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pfHeroC{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pfBar0{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pfBar1{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pfBar2{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</helmet>

<section style="position:relative;width:100%;height:520px;overflow:hidden;background:#F6F7F9;border-bottom:1px solid #E9ECF1">
<sc-for list="{{ slides }}" as="s" hint-placeholder-count="1">
<div style="position:absolute;inset:0;transition:opacity 480ms cubic-bezier(.2,.7,.2,1);opacity:{{ s.op }};z-index:{{ s.z }}">
<div style="position:absolute;inset:0;background-image:url('{{ s.art }}');background-size:cover;background-position:center"></div>
<div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.94) 30%,rgba(255,255,255,.55) 52%,rgba(255,255,255,0) 68%)"></div>
<div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,{{ s.wash }} 0%,rgba(255,255,255,0) 46%)"></div>
</div>
</sc-for>

<div style="position:absolute;inset:0;z-index:3;pointer-events:none">
<div style="width:1280px;height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center">
<div style="max-width:544px;animation:{{ heroAnim }}">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
<dc-import name="Body" as="span" size="xs" weight="bold" color="inverse" sx="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:{{ spot.accent }}" hint-size="120px,18px">{{ spot.eyebrow }}</dc-import>
</div>
<dc-import name="Headline" as="h1" size="xl" sx="margin:0;text-wrap:balance" hint-size="280px,55px">{{ spot.title }}</dc-import>
<dc-import name="Body" as="p" size="md" color="body" sx="margin:20px 0 0;max-width:470px;text-wrap:pretty" hint-size="160px,24px">{{ spot.desc }}</dc-import>
<div style="display:flex;align-items:center;gap:10px;margin:24px 0 0">
<dc-import name="Body" as="span" size="xs" weight="bold" color="secondary" caps="{{ true }}" sx="padding:4px 9px;background:rgba(255,255,255,.72);letter-spacing:.06em" hint-size="120px,18px">{{ spot.engine }}</dc-import>
<dc-import name="Body" as="span" size="sm" color="tertiary" hint-size="140px,21px">누적 플레이 {{ spot.plays }}</dc-import>
</div>
<div style="display:flex;align-items:center;gap:12px;margin:34px 0 0;pointer-events:auto">
<button style="height:48px;padding:0 26px;background:#0F172A;border:0;transition:200ms" type="button" style-hover="background:#2563EB"><dc-import name="Body" as="span" weight="bold" size="md" color="inverse" hint-size="160px,24px">지금 플레이</dc-import></button>
<button style="height:48px;padding:0 18px;background:transparent;border:0;transition:color 200ms cubic-bezier(.2,.7,.2,1),background 200ms cubic-bezier(.2,.7,.2,1),box-shadow 200ms cubic-bezier(.2,.7,.2,1)" type="button" style-hover="color:#0F172A;background:#FFFFFF;box-shadow:0 0 16px 0 rgba(0,0,0,.16)"><dc-import name="Body" as="span" size="md" weight="semibold" color="secondary" hint-size="160px,24px">자세히 보기</dc-import></button>
</div>
</div>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;width:1280px;margin:0 auto;height:0;z-index:4">
<div style="position:absolute;right:0;bottom:34px;display:flex;align-items:center;gap:14px">
<div style="display:flex;align-items:center;gap:6px">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
<button type="button" onClick="{{ d.go }}" aria-label="슬라이드" style="border:0;padding:0;height:4px;transition:width 320ms cubic-bezier(.2,.7,.2,1),background 320ms cubic-bezier(.2,.7,.2,1);width:{{ d.w }};background:{{ d.bg }}"></button>
</sc-for>
</div>
<dc-import name="Body" as="span" size="xs" weight="semibold" color="tertiary" tabular="{{ true }}" sx="letter-spacing:.06em" hint-size="120px,18px">{{ slideCounter }}</dc-import>
<div style="display:flex;gap:4px">
<button style="border:0;width:34px;height:34px;background:rgba(255,255,255,.94);transition:200ms" type="button" onClick="{{ prevSlide }}" aria-label="이전" style-hover="border-color:#2563EB;color:#FFFFFF;background:#2563EB"><dc-import name="Body" as="span" size="md" color="secondary" hint-size="160px,24px">&#8249;</dc-import></button>
<button style="border:0;width:34px;height:34px;background:rgba(255,255,255,.94);transition:200ms" type="button" onClick="{{ nextSlide }}" aria-label="다음" style-hover="border-color:#2563EB;color:#FFFFFF;background:#2563EB"><dc-import name="Body" as="span" size="md" color="secondary" hint-size="160px,24px">&#8250;</dc-import></button>
</div>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:3px;z-index:5;background:rgba(226,232,240,.7)">
<div style="height:3px;transform-origin:0 50%;background:#2563EB;animation:{{ barAnim }}"></div>
</div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:520},&quot;slides&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Slide[]&quot;},&quot;spot&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Spotlight&quot;},&quot;heroAnim&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;pfHeroA 640ms cubic-bezier(.2,.7,.2,1) both&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;barAnim&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;pfBar0 6s linear both&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dots&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Dot[]&quot;},&quot;slideCounter&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01 / 03&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;prevSlide&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;nextSlide&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
