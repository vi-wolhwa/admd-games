<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes psGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.psLink span{transition:color 120ms cubic-bezier(.2,.7,.2,1)}
.psLink:hover span{color:#2563EB!important}
</style>
</helmet>

<div>
<div style="display:flex;align-items:center;gap:13px">
<span style="position:relative;width:56px;height:56px;flex:none">
<dc-import name="Body" as="span" weight="bold" size="md" color="inverse" sx="display:inline;position:absolute;inset:0;border-radius:{{ avatarRadius }};background:{{ accent }};display:grid;place-items:center" hint-size="160px,24px">{{ initial }}</dc-import>
<sc-if value="{{ hasLevel }}" hint-placeholder-val="{{ false }}">
<dc-import name="Body" as="span" size="xs" weight="bold" color="inverse" sx="position:absolute;right:-4px;bottom:-3px;padding:2px 7px;background:#0F172A" hint-size="120px,18px">{{ level }}</dc-import>
</sc-if>
</span>
<div style="min-width:0">
<dc-import name="Headline" as="h2" size="sm" hint-size="220px,31px">{{ displayName }}</dc-import>
<dc-import name="Body" as="div" size="xs" weight="semibold" sx="margin-top:3px;color:{{ tierColor }}" hint-size="120px,18px">{{ tier }}</dc-import>
</div>
<sc-if value="{{ showMyPage }}" hint-placeholder-val="{{ false }}">
<a class="psLink" style="margin-left:auto;flex:none"><dc-import name="Body" as="span" size="xs" weight="semibold" hint-size="120px,18px">마이페이지</dc-import></a>
</sc-if>
</div>

<div style="margin-top:18px">
<div style="display:flex;align-items:baseline;justify-content:space-between">
<dc-import name="Body" as="span" size="xs" weight="semibold" color="secondary" tabular="{{ true }}" hint-size="120px,18px">{{ xpLabel }}</dc-import>
<dc-import name="Body" as="span" size="xs" color="tertiary" hint-size="120px,18px">{{ nextLabel }}</dc-import>
</div>
<div style="margin-top:7px;height:6px;background:#E2E8F0;overflow:hidden">
<div style="height:6px;width:{{ xpPct }};background:{{ accent }};transform-origin:0 50%;animation:{{ barAnim }}"></div>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:18px;background:#F1F3F5">
<sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
<div style="background:#FFFFFF;padding:12px 11px">
<dc-import name="Display" as="span" size="{{ statSize }}" sx="color:{{ s.color }};font-variant-numeric:tabular-nums" hint-size="90px,34px">{{ s.value }}</dc-import>
<dc-import name="Body" as="div" size="xs" color="tertiary" sx="margin-top:2px" hint-size="120px,18px">{{ s.label }}</dc-import>
</div>
</sc-for>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:330,&quot;height&quot;:210},&quot;initial&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;진&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;진수 님&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tier&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;코드 러너 · 상위 8%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lv.12&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hasLevel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;avatarRadius&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showMyPage&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;xpLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;경험치 8,760 XP&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nextLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lv.13까지 1,240&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;xpPct&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;78%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;barAnim&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;psGrow 1.1s cubic-bezier(.2,.7,.2,1) both&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stats&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Stat[]&quot;,&quot;default&quot;:[{&quot;value&quot;:&quot;41시간&quot;,&quot;label&quot;:&quot;플레이 시간&quot;,&quot;color&quot;:&quot;#0F172A&quot;},{&quot;value&quot;:&quot;3&quot;,&quot;label&quot;:&quot;저장한 게임&quot;,&quot;color&quot;:&quot;#2563EB&quot;},{&quot;value&quot;:&quot;12&quot;,&quot;label&quot;:&quot;도전과제&quot;,&quot;color&quot;:&quot;#8949FF&quot;}]}}">class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      accent: p.accent ?? "#2563EB",
      tierColor: p.tierColor ?? "#8949FF",
      statSize: { "16px": "sm", "21px": "sm", "28px": "md", "32px": "md" }[p.statSize ?? "21px"] || "sm",
      avatarRadius: p.avatarRadius ?? "0px",
      barAnim: p.barAnim ?? "psGrow 1.1s cubic-bezier(.2,.7,.2,1) both"
    };
  }
}
</script>
</body>
</html>
