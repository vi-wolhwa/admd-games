<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
{{ el }}
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:72},&quot;as&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;h1&quot;,&quot;h2&quot;,&quot;h3&quot;,&quot;h4&quot;,&quot;h5&quot;,&quot;h6&quot;,&quot;div&quot;,&quot;p&quot;,&quot;span&quot;],&quot;default&quot;:&quot;span&quot;,&quot;tsType&quot;:&quot;TextAs&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;4xs&quot;,&quot;3xs&quot;,&quot;2xs&quot;,&quot;xs&quot;,&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;,&quot;xl&quot;,&quot;2xl&quot;,&quot;3xl&quot;,&quot;4xl&quot;],&quot;default&quot;:&quot;2xs&quot;,&quot;tsType&quot;:&quot;TextSize&quot;},&quot;weight&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;medium&quot;,&quot;semibold&quot;,&quot;bold&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;TextWeight&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;primary&quot;,&quot;body&quot;,&quot;secondary&quot;,&quot;tertiary&quot;,&quot;quaternary&quot;,&quot;inverse&quot;],&quot;default&quot;:&quot;primary&quot;,&quot;tsType&quot;:&quot;TextColor&quot;},&quot;caps&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tabular&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sx&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Snippet&quot;},&quot;style&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;CSSProperties&quot;},&quot;className&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  static SIZE = { "4xs": 12, "3xs": 14, "2xs": 16, xs: 18, sm: 21, md: 24, lg: 28, xl: 32, "2xl": 37, "3xl": 43, "4xl": 50 };
  static LH = { "4xs": 1.5, "3xs": 1.5, "2xs": 1.5, xs: 1.5, sm: 1.4625, md: 1.425, lg: 1.375, xl: 1.325, "2xl": 1.2625, "3xl": 1.1875, "4xl": 1.1 };
  static TRACK = { "4xs": "-.008em", "3xs": "-.014em", "2xs": "-.02em", xs: "-.024em", sm: "-.028em", md: "-.03em", lg: "-.034em", xl: "-.036em", "2xl": "-.038em", "3xl": "-.04em", "4xl": "-.04em" };
  static WEIGHT = { thin: 100, extralight: 200, light: 300, normal: 400, medium: 500, semibold: 600, bold: 700, extrabold: 800, black: 900 };
  static COLOR = { primary: "#0F172A", body: "#475569", secondary: "#64748B", tertiary: "#94A3B8", quaternary: "#CBD5E1", inverse: "#FFFFFF" };
  static RESERVED = new Set(["as", "size", "weight", "color", "caps", "tabular", "sx", "children", "style", "className", "key"]);

  static parseSx(s) {
    const o = {};
    if (!s) return o;
    if (typeof s === "object") return s;
    for (const d of String(s).split(";")) {
      const i = d.indexOf(":");
      if (i < 0) continue;
      const p = d.slice(0, i).trim();
      if (!p) continue;
      o[p.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = d.slice(i + 1).trim();
    }
    return o;
  }

  renderVals() {
    const K = Component;
    const size = K.SIZE[this.props.size] ? this.props.size : "2xs";
    const as = this.props.as || "span";
    const caps = this.props.caps ?? false;

    const rest = {};
    for (const k in this.props) {
      if (K.RESERVED.has(k) || k.startsWith("__") || k.startsWith("hint")) continue;
      rest[k] = this.props[k];
    }

    const style = {
      margin: 0,
      fontSize: K.SIZE[size] + "px",
      lineHeight: K.LH[size],
      fontWeight: K.WEIGHT[this.props.weight] || 400,
      letterSpacing: caps ? ".06em" : K.TRACK[size],
      color: K.COLOR[this.props.color] || K.COLOR.primary,
      ...(caps ? { textTransform: "uppercase" } : null),
      ...(this.props.tabular ? { fontVariantNumeric: "tabular-nums" } : null),
      ...K.parseSx(this.props.sx),
      ...(this.props.style || null)
    };

    return { el: React.createElement(as, { ...rest, style, className: this.props.className }, this.props.children) };
  }
}

</script>
</body>
</html>
