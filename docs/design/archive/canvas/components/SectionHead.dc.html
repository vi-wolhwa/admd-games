<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:baseline;gap:10px;min-width:0">
<dc-import name="Headline" as="h2" size="sm" sx="margin:0;white-space:nowrap" hint-size="220px,31px">{{ title }}</dc-import>
<dc-import name="Body" as="span" size="sm" color="tertiary" sx="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" hint-size="140px,21px">{{ subtitle }}</dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:44},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;내 라이브러리&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;플레이 기록과 도전과제&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
