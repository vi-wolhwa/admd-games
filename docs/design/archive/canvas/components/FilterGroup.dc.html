<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:11px">
<dc-import name="Body" as="span" size="xs" weight="bold" sx="flex:none;width:{{ labelWidth }}" hint-size="120px,18px">{{ label }}</dc-import>
<div style="display:flex;gap:6px">
<sc-for list="{{ opts }}" as="o" hint-placeholder-count="4">
<button style="height:30px;padding:0 14px;border:0;transition:background 200ms cubic-bezier(.2,.7,.2,1),color 200ms cubic-bezier(.2,.7,.2,1);background:{{ o.bg }}" type="button" onClick="{{ o.go }}" onMouseEnter="{{ o.enter }}" onMouseLeave="{{ o.leave }}"><dc-import name="Body" as="span" size="xs" sx="color:{{ o.fg }};font-weight:{{ o.weight }};transition:color 200ms cubic-bezier(.2,.7,.2,1)" hint-size="120px,18px">{{ o.name }}</dc-import></button>
</sc-for>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:54},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;플레이&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;labelWidth&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;52px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;opts&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;FilterOpt[]&quot;,&quot;default&quot;:[{&quot;name&quot;:&quot;전체&quot;,&quot;weight&quot;:700,&quot;bg&quot;:&quot;#0F172A&quot;,&quot;fg&quot;:&quot;#FFFFFF&quot;},{&quot;name&quot;:&quot;싱글&quot;,&quot;weight&quot;:500,&quot;bg&quot;:&quot;transparent&quot;,&quot;fg&quot;:&quot;#64748B&quot;},{&quot;name&quot;:&quot;멀티&quot;,&quot;weight&quot;:500,&quot;bg&quot;:&quot;transparent&quot;,&quot;fg&quot;:&quot;#64748B&quot;}]}}"></script>
</body>
</html>
