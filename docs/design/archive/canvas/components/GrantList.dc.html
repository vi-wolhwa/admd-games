<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.glList>*:last-child{border-bottom-color:transparent!important}
.glRow{position:relative;transition:box-shadow 200ms cubic-bezier(.2,.7,.2,1)}
.glRow:hover,.glRow:active{z-index:2;box-shadow:0 0 16px 0 rgba(0,0,0,.16)}
.glName{transition:color 120ms cubic-bezier(.2,.7,.2,1)}
.glRow:hover .glName{color:#EA580C}
</style>
</helmet>

<div style="height:100%;background:#FFFFFF;padding:18px 20px 0;display:flex;flex-direction:column">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:14px">
<dc-import name="Body" as="span" size="xs" weight="bold" color="secondary" sx="letter-spacing:.06em" hint-size="120px,18px">{{ title }}</dc-import>
<dc-import name="Body" as="span" size="xs" color="tertiary" hint-size="120px,18px">잼 · 지원사업 · 공모전 {{ count }}건</dc-import>
</div>
<div class="glList" style="flex:1;display:flex;flex-direction:column;padding-bottom:14px">
<sc-for list="{{ items }}" as="g" hint-placeholder-count="5">
<a class="glRow" style="flex:1;min-height:0;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:13px;align-items:center;padding:0 12px;margin:0 -12px;border-bottom:1px solid #F1F3F5">
<div style="text-align:center">
<dc-import name="Body" as="div" size="sm" weight="bold" tabular="{{ true }}" sx="color:{{ g.ddayColor }}" hint-size="140px,21px">{{ g.dday }}</dc-import>
<dc-import name="Body" as="div" size="xs" weight="bold" color="tertiary" sx="margin-top:2px;letter-spacing:.06em" hint-size="120px,18px">{{ g.kind }}</dc-import>
</div>
<div style="min-width:0">
<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" class="glName"><dc-import name="Body" as="div" size="xs" weight="bold" hint-size="120px,18px">{{ g.name }}</dc-import></div>
<dc-import name="Body" as="div" size="xs" color="tertiary" sx="margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" hint-size="120px,18px">{{ g.org }} · {{ g.close }} 마감</dc-import>
</div>
<div style="text-align:right">
<dc-import name="Body" as="div" size="xs" weight="bold" hint-size="120px,18px">{{ g.amount }}</dc-import>
<dc-import name="Body" as="div" size="xs" color="tertiary" sx="margin-top:3px" hint-size="120px,18px">{{ g.who }}</dc-import>
</div>
</a>
</sc-for>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:412},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;지금 접수 중&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;7&quot;,&quot;tsType&quot;:&quot;string | number&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;GrantRow[]&quot;}}"></script>
</body>
</html>
