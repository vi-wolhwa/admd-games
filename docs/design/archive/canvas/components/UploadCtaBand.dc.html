<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="width:100%;min-width:1280px;background:#0F172A">
<div style="width:1280px;margin:0 auto;padding:44px 0;display:flex;align-items:center;justify-content:space-between;gap:48px">
<div style="min-width:0">
<dc-import name="Body" as="div" size="xs" weight="bold" sx="letter-spacing:.06em;color:#F97316" hint-size="120px,18px">MAKERS GROUND</dc-import>
<dc-import name="Headline" as="h2" size="sm" color="inverse" sx="margin-top:12px;text-wrap:balance" hint-size="220px,31px">어떤 엔진으로 만들어도, 오늘 만든 것이 오늘 플레이됩니다</dc-import>
<dc-import name="Body" as="p" size="sm" color="tertiary" sx="margin:12px 0 0;max-width:620px;text-wrap:pretty" hint-size="140px,21px">WebGL 빌드는 브라우저에서 바로 실행되고, Windows · macOS · 모바일 빌드는 다운로드로 배포됩니다. 올리면 플레이 그라운드에 노출되고, 피드백과 지표가 바로 쌓입니다.</dc-import>
</div>
<div style="flex:none;display:flex;flex-direction:column;gap:14px;min-width:300px">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.14)">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
<div style="background:#0F172A;padding:0 0 0 14px">
<dc-import name="Body" as="div" size="xs" weight="bold" sx="color:#F97316" hint-size="120px,18px">{{ s.no }}</dc-import>
<dc-import name="Body" as="div" size="xs" weight="bold" color="inverse" sx="margin-top:6px" hint-size="120px,18px">{{ s.name }}</dc-import>
<dc-import name="Body" as="div" size="xs" color="tertiary" sx="margin-top:4px" hint-size="120px,18px">{{ s.desc }}</dc-import>
</div>
</sc-for>
</div>
<div style="display:flex;gap:10px;margin-top:6px">
<button style="flex:1;height:46px;background:#EA580C;border:0;transition:background 200ms cubic-bezier(.2,.7,.2,1)" type="button" style-hover="background:#F97316"><dc-import name="Body" as="span" size="sm" weight="bold" color="inverse" hint-size="140px,21px">빌드 올리기</dc-import></button>
<button style="height:46px;padding:0 18px;background:rgba(255,255,255,.14);border:0;transition:200ms cubic-bezier(.2,.7,.2,1)" type="button" style-hover="background:rgba(255,255,255,.14)"><dc-import name="Body" as="span" size="sm" weight="semibold" color="inverse" hint-size="140px,21px">가이드 보기</dc-import></button>
</div>
</div>
</div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:250},&quot;steps&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Step[]&quot;}}"></script>
</body>
</html>
