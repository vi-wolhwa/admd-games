<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.ssCard{transition:box-shadow 200ms cubic-bezier(.2,.7,.2,1)}
.ssCard:hover,.ssCard:active{box-shadow:0 0 16px 0 rgba(0,0,0,.16)}
.ssArrow{transition:color 120ms cubic-bezier(.2,.7,.2,1)}
.ssCard:hover .ssArrow{color:#EA580C}
</style>
</helmet>

<div style="height:100%;display:flex;flex-direction:column;gap:20px">
<sc-for list="{{ items }}" as="x" hint-placeholder-count="2">
<a class="ssCard" style="flex:1;background:#FFFFFF;padding:18px 18px 16px;display:flex;flex-direction:column;justify-content:space-between">
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<dc-import name="Body" as="span" size="xs" weight="bold" hint-size="120px,18px">{{ x.label }}</dc-import>
<span class="ssArrow"><dc-import name="Body" as="span" size="sm" color="quaternary" hint-size="140px,21px">&#8594;</dc-import></span>
</div>
<div>
<div style="display:flex;align-items:baseline;gap:4px;line-height:1.05">
<dc-import name="Display" as="span" size="md" hint-size="120px,42px">{{ x.value }}</dc-import>
<dc-import name="Body" as="span" size="xs" weight="semibold" color="tertiary" hint-size="120px,18px">{{ x.unit }}</dc-import>
</div>
<dc-import name="Body" as="div" size="xs" color="tertiary" sx="margin-top:10px" hint-size="120px,18px">{{ x.sub }}</dc-import>
</div>
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
<dc-import name="Body" as="span" size="xs" weight="bold" sx="color:#008638" hint-size="120px,18px">{{ x.delta }}</dc-import>
<dc-import name="Body" as="span" size="xs" color="tertiary" hint-size="120px,18px">{{ x.note }}</dc-import>
</div>
</a>
</sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:208,&quot;height&quot;:340},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ShelfCount[]&quot;}}"></script>
</body>
</html>
