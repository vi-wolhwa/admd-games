<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="width:1280px;margin:0 auto;padding:64px 0 0">
<div style="min-width:0">
<div style="display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid #E9ECF1">
<dc-import name="SectionHead" title="{{ title }}" subtitle="{{ subtitle }}" hint-size="360px,30px"></dc-import>
<div style="display:flex;gap:4px">
<button style="border:0;width:28px;height:28px;background:#FFFFFF;transition:200ms" type="button" onClick="{{ onPrev }}" aria-label="이전" style-hover="border-color:#2563EB;color:#2563EB;background:#F6F7F9"><dc-import name="Body" as="span" size="md" color="secondary" hint-size="160px,24px">&#8249;</dc-import></button>
<button style="border:0;width:28px;height:28px;background:#FFFFFF;transition:200ms" type="button" onClick="{{ onNext }}" aria-label="다음" style-hover="border-color:#2563EB;color:#2563EB;background:#F6F7F9"><dc-import name="Body" as="span" size="md" color="secondary" hint-size="160px,24px">&#8250;</dc-import></button>
</div>
</div>
<div style="overflow:hidden;padding:24px 0 26px;margin:0 0 -26px">
<div style="display:flex;gap:16px;transition:transform 480ms cubic-bezier(.2,.7,.2,1);transform:translateX({{ offsetX }})">
<sc-for list="{{ items }}" as="r" hint-placeholder-count="4">
<dc-import name="GameTile" game="{{ r }}" width="232px" show-achievements="{{ signedIn }}" style="flex:none" hint-size="232px,240px"></dc-import>
</sc-for>
</div>
</div>
</div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:340},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;최근 플레이&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;최근에 플레이한 순서대로&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;RecentGame[]&quot;},&quot;offsetX&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onPrev&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onNext&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;signedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}"></script>
</body>
</html>
