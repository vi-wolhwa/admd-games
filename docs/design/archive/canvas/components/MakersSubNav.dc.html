<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes mnPulse{0%{transform:scale(1);opacity:.85}70%{transform:scale(2.6);opacity:0}100%{transform:scale(2.6);opacity:0}}
</style>
</helmet>

<div style="height:48px"></div>
<header style="min-width:1280px;position:fixed;top:70px;left:0;right:0;z-index:29;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid #E9ECF1">
<div style="border-top:1px solid #F1F3F5;background:rgba(255,255,255,.72)">
<div style="width:1280px;margin:0 auto;height:46px;display:flex;align-items:center;gap:2px">
<sc-for list="{{ items }}" as="n" hint-placeholder-count="6">
<a style="height:46px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:14px;line-height:1.5;letter-spacing:-.014em;font-weight:{{ n.weight }};color:{{ n.fg }};box-shadow:{{ n.underline }};transition:color 120ms cubic-bezier(.2,.7,.2,1)" style-hover="color:#0F172A">{{ n.name }}
<sc-if value="{{ n.hasCount }}" hint-placeholder-val="{{ false }}">
<dc-import name="Body" as="span" size="xs" weight="semibold" sx="color:{{ accent }}" hint-size="120px,18px">{{ n.count }}</dc-import>
</sc-if>
</a>
</sc-for>
<div style="flex:1"></div>
<div style="display:flex;align-items:center;gap:7px">
<span style="position:relative;width:6px;height:6px;flex:none">
<span style="position:absolute;inset:0;border-radius:999px;background:#008638"></span>
<span style="position:absolute;inset:0;border-radius:999px;background:#008638;animation:mnPulse 1.8s cubic-bezier(.2,.7,.2,1) infinite"></span>
</span>
<dc-import name="Body" as="span" size="xs" color="secondary" tabular="{{ true }}" hint-size="120px,18px">지금 {{ onlineNow }}명 활동 중</dc-import>
</div>
</div>
</div>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:48},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;SubNavItem[]&quot;},&quot;onlineNow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;312&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#EA580C&quot;,&quot;options&quot;:[&quot;#EA580C&quot;,&quot;#EA580C&quot;],&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
