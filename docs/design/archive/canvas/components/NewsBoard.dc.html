<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes nbSweep{from{width:0}to{width:100%}}
.nbFeature{transition:box-shadow 200ms cubic-bezier(.2,.7,.2,1)}
.nbFeature:hover,.nbFeature:active{z-index:2;box-shadow:0 0 16px 0 rgba(0,0,0,.16)}
.nbTitle,.nbCta{transition:color 120ms cubic-bezier(.2,.7,.2,1)}
.nbFeature:hover .nbTitle,.nbFeature:hover .nbCta{color:#EA580C}
</style>
</helmet>

<div style="display:grid;grid-template-columns:minmax(0,1fr) 424px;gap:24px;height:372px">

<a class="nbFeature" style="position:relative;display:flex;flex-direction:column;background:#FFFFFF;padding:26px 28px 24px;margin:0;overflow:hidden">
<div style="position:relative;display:flex;align-items:center;gap:10px">
<span style="width:3px;height:15px;background:#0F172A"></span>
<dc-import name="Body" as="span" size="xs" weight="bold" sx="letter-spacing:.06em" hint-size="120px,18px">{{ feature.cat }}</dc-import>
<dc-import name="Body" as="span" size="xs" weight="semibold" hint-size="120px,18px">{{ feature.source }}</dc-import>
<span style="width:3px;height:3px;border-radius:999px;background:#CBD5E1"></span>
<dc-import name="Body" as="span" size="xs" color="tertiary" hint-size="120px,18px">{{ feature.when }}</dc-import>
</div>
<div style="position:relative;margin-top:14px;text-wrap:balance" class="nbTitle"><dc-import name="Headline" as="h2" size="sm" hint-size="220px,31px">{{ feature.title }}</dc-import></div>
<dc-import name="Body" as="p" size="sm" color="secondary" sx="position:relative;margin:13px 0 0;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden" hint-size="140px,21px">{{ feature.sum }}</dc-import>
<div style="position:relative;margin-top:auto;padding-top:18px">
<div style="display:flex;align-items:flex-end;gap:28px">
<sc-for list="{{ feature.metrics }}" as="m" hint-placeholder-count="3">
<div>
<div style="display:flex;align-items:baseline;gap:4px">
<dc-import name="Display" as="span" size="sm" tabular="{{ true }}" sx="display:inline" hint-size="90px,34px">{{ m.value }}</dc-import>
<dc-import name="Body" as="span" size="xs" weight="semibold" color="tertiary" hint-size="120px,18px">{{ m.label }}</dc-import>
</div>
</div>
</sc-for>
<span style="margin-left:auto" class="nbCta"><dc-import name="Body" as="span" size="xs" weight="bold" color="tertiary" hint-size="120px,18px">원문 읽기 &#8594;</dc-import></span>
</div>
<div style="margin-top:14px;height:3px;background:#F1F3F5;overflow:hidden">
<div key="{{ feature.index }}" style="height:3px;background:#EA580C;transform-origin:0 50%;animation:nbSweep 5.6s linear both"></div>
</div>
</div>
</a>

<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ cards }}" as="n" hint-placeholder-count="5">
<a onMouseEnter="{{ n.enter }}" onMouseLeave="{{ n.leave }}" onClick="{{ n.enter }}" style="flex:1;min-height:0;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:#FFFFFF;padding:0 14px;box-shadow:{{ n.shadow }};transition:box-shadow 200ms cubic-bezier(.2,.7,.2,1)">
<div style="text-align:center">
<dc-import name="Body" as="div" size="xs" weight="bold" tabular="{{ true }}" sx="color:{{ n.dateColor }}" hint-size="120px,18px">{{ n.when }}</dc-import>
<dc-import name="Body" as="div" size="xs" weight="bold" sx="margin-top:3px;display:inline-flex;padding:1px 5px;background:{{ n.catBg }};letter-spacing:.06em;color:{{ n.catFg }}" hint-size="120px,18px">{{ n.cat }}</dc-import>
</div>
<div style="min-width:0">
<dc-import name="Body" as="div" size="xs" weight="bold" sx="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 200ms cubic-bezier(.2,.7,.2,1);color:{{ n.titleColor }}" hint-size="120px,18px">{{ n.title }}</dc-import>
<dc-import name="Body" as="div" size="xs" color="tertiary" sx="margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" hint-size="120px,18px">{{ n.source }}</dc-import>
</div>
<dc-import name="Body" as="span" size="xs" weight="bold" color="secondary" tabular="{{ true }}" hint-size="120px,18px">{{ n.reads }}</dc-import>
</a>
</sc-for>
</div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:372},&quot;feature&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;NewsFeature&quot;},&quot;cards&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;NewsCard[]&quot;}}"></script>
</body>
</html>
