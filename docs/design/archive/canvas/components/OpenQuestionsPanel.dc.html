<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes oqFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.oqRow{transition:box-shadow 200ms cubic-bezier(.2,.7,.2,1)}
.oqRow:hover,.oqRow:active{z-index:2;box-shadow:0 0 16px 0 rgba(0,0,0,.16)}
.oqTitle,.oqMark{transition:color 120ms cubic-bezier(.2,.7,.2,1),background 120ms cubic-bezier(.2,.7,.2,1)}
.oqRow:hover .oqTitle{color:#EA580C}
.oqRow:hover .oqMark{background:#EA580C;color:#FFFFFF}
</style>
</helmet>

<div style="height:100%;background:#FFFFFF;padding:20px 22px 18px;display:flex;flex-direction:column;min-height:460px">
<dc-import name="PanelHeadline" count="{{ count }}" prefix="건의 질문이 " highlight="답변" suffix="을 기다립니다" chip="전체 · 채택 전" note="첫 답변까지 평균 {{ firstReply }}" accent="#EA580C" hint-size="100%,90px"></dc-import>
<div style="flex:1;display:flex;flex-direction:column;margin-top:16px">
<sc-for list="{{ items }}" as="q" hint-placeholder-count="4">
<a class="oqRow" style="position:relative;flex:1;min-height:0;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;align-items:center;padding:0 12px;margin:0 -12px;border-top:1px solid #F1F3F5;animation:oqFade 200ms cubic-bezier(.2,.7,.2,1) both;animation-delay:{{ q.delay }}" key="{{ q.key }}">
<span style="display:grid;place-items:center;width:26px;height:26px;background:{{ q.markBg }}" class="oqMark"><dc-import name="Body" as="span" size="xs" weight="bold" hint-size="120px,18px">?</dc-import></span>
<div style="min-width:0">
<div style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden" class="oqTitle"><dc-import name="Body" as="div" size="sm" weight="bold" hint-size="140px,21px">{{ q.title }}</dc-import></div>
<div style="margin-top:6px;display:flex;align-items:center;gap:6px;min-width:0">
<dc-import name="Body" as="span" size="xs" weight="bold" sx="flex:none;padding:2px 6px;background:#F1F3F5;color:#475569" hint-size="120px,18px">{{ q.tag }}</dc-import>
<dc-import name="Body" as="span" size="xs" color="tertiary" sx="flex:none" hint-size="120px,18px">{{ q.age }}</dc-import>
<span style="flex:none;width:3px;height:3px;border-radius:999px;background:#CBD5E1"></span>
<dc-import name="Body" as="span" size="xs" color="tertiary" sx="flex:none" hint-size="120px,18px">조회 {{ q.views }}</dc-import>
<dc-import name="Body" as="span" size="xs" weight="bold" sx="flex:none;margin-left:auto;color:{{ q.answerColor }}" hint-size="120px,18px">{{ q.answerLabel }}</dc-import>
</div>
</div>
</a>
</sc-for>
</div>
<a style="margin-top:14px"><dc-import name="Body" as="span" size="xs" weight="semibold" hint-size="120px,18px">{{ linkLabel }} &#8594;</dc-import></a>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:460},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;74&quot;,&quot;tsType&quot;:&quot;string | number&quot;},&quot;firstReply&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;42분&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Question[]&quot;},&quot;linkLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;질문 전체 보기&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
