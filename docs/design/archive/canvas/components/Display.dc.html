<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<dc-import name="Text" as="{{ as }}" size="{{ textSize }}" weight="bold" color="{{ color }}" caps="{{ caps }}" tabular="{{ tabular }}" sx="{{ sx }}" dc-props="{{ rest }}" hint-size="160px,44px">{{ children }}</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:72},&quot;as&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;div&quot;,&quot;p&quot;,&quot;span&quot;],&quot;default&quot;:&quot;span&quot;,&quot;tsType&quot;:&quot;DisplayAs&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;DisplaySize&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;primary&quot;,&quot;secondary&quot;,&quot;tertiary&quot;,&quot;inverse&quot;],&quot;default&quot;:&quot;primary&quot;,&quot;tsType&quot;:&quot;DisplayColor&quot;},&quot;tabular&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;caps&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sx&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Snippet&quot;}}">
class Component extends DCLogic {
  static MAP = { sm: "md", md: "xl", lg: "3xl" };
  static AS = ["div", "p", "span"];
  static OWN = new Set(["as", "size", "color", "caps", "tabular", "sx", "children", "key"]);

  renderVals() {
    const K = Component;
    const rest = {};
    for (const k in this.props) {
      if (K.OWN.has(k) || k.startsWith("__") || k.startsWith("hint")) continue;
      rest[k] = this.props[k];
    }
    const size = K.MAP[this.props.size] ? this.props.size : "md";
    return {
      as: K.AS.includes(this.props.as) ? this.props.as : "span",
      textSize: K.MAP[size],
      color: this.props.color || "primary",
      caps: this.props.caps ?? false,
      tabular: this.props.tabular ?? true,
      sx: this.props.sx || "",
      rest,
      children: this.props.children
    };
  }
}

</script>
</body>
</html>
