<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes rcRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rcCard{transition:box-shadow 200ms cubic-bezier(.2,.7,.2,1)}
.rcCard:hover,.rcCard:active{box-shadow:0 0 16px 0 rgba(0,0,0,.16)}
.rcZoom{position:absolute;inset:0;transition:transform 320ms cubic-bezier(.2,.7,.2,1)}
.rcCard:hover .rcZoom{transform:scale(1.06)}
.rcName{transition:color 120ms cubic-bezier(.2,.7,.2,1)}
.rcCard:hover .rcName{color:#EA580C}
</style>
</helmet>

<div style="height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px">
<sc-for list="{{ cards }}" as="r" hint-placeholder-count="2">
<a class="rcCard" style="display:flex;flex-direction:column;background:#FFFFFF;animation:rcRise 480ms cubic-bezier(.2,.7,.2,1) both;animation-delay:{{ r.delay }}">
<div style="position:relative;width:100%;height:174px;background:#F1F3F5;overflow:hidden">
<div class="rcZoom"><image-slot id="{{ r.slot }}" shape="rect" placeholder="{{ r.title }}"></image-slot></div>
<dc-import name="Body" as="span" size="xs" weight="bold" color="inverse" sx="position:absolute;top:0;left:0;z-index:4;padding:4px 8px;background:{{ r.badgeBg }};letter-spacing:.06em" hint-size="120px,18px">{{ r.badge }}</dc-import>
</div>
<div style="flex:1;padding:16px 20px 18px;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;gap:10px">
<dc-import name="Body" as="span" size="xs" weight="bold" color="inverse" sx="width:34px;height:34px;flex:none;border-radius:999px;background:{{ r.authorColor }};display:grid;place-items:center" hint-size="120px,18px">{{ r.initial }}</dc-import>
<div style="min-width:0">
<div style="display:flex;align-items:center;gap:6px;min-width:0">
<span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" class="rcName"><dc-import name="Body" as="span" weight="bold" size="md" hint-size="160px,24px">{{ r.author }}</dc-import></span>
<sc-if value="{{ r.subscribed }}" hint-placeholder-val="{{ false }}">
<dc-import name="Body" as="span" size="xs" weight="bold" color="inverse" sx="flex:none;padding:1px 5px;background:#EA580C" hint-size="120px,18px">구독중</dc-import>
</sc-if>
</div>
<dc-import name="Body" as="div" size="xs" color="tertiary" sx="margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" hint-size="120px,18px">{{ r.meta }}</dc-import>
</div>
</div>
<dc-import name="Body" as="p" size="xs" weight="semibold" sx="margin:12px 0 0;text-wrap:pretty" hint-size="120px,18px">{{ r.title }}</dc-import>
<dc-import name="Body" as="span" size="xs" weight="bold" sx="margin-top:auto;padding-top:14px;color:#EA580C" hint-size="120px,18px">{{ r.cta }} &#8594;</dc-import>
</div>
</a>
</sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:420},&quot;cards&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ReadCard[]&quot;}}"></script>
</body>
</html>
