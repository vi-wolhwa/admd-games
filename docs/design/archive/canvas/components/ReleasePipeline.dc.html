<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.rlScroll{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
.rlScroll::-webkit-scrollbar{width:0;height:0}
.rlRow{position:relative;transition:box-shadow 200ms cubic-bezier(.2,.7,.2,1)}
.rlRow:hover,.rlRow:active{z-index:2;box-shadow:0 0 16px 0 rgba(0,0,0,.16)}
.rlTitle{transition:color 120ms cubic-bezier(.2,.7,.2,1)}
.rlRow:hover .rlTitle{color:#EA580C}
</style>
</helmet>

<div onMouseLeave="{{ onReset }}" style="height:100%;background:#FFFFFF;padding:18px 20px 0;display:flex;flex-direction:column">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:10px">
<dc-import name="Body" as="span" size="xs" weight="bold" color="secondary" sx="letter-spacing:.06em" hint-size="120px,18px">{{ title }}</dc-import>
<a><dc-import name="Body" as="span" size="xs" weight="semibold" hint-size="120px,18px">전체</dc-import></a>
</div>
<div style="display:flex;align-items:center;gap:12px;padding-bottom:12px">
<sc-for list="{{ stages }}" as="p" hint-placeholder-count="3">
<span style="display:flex;align-items:center;gap:5px">
<span style="width:7px;height:7px;background:{{ p.color }}"></span>
<dc-import name="Body" as="span" size="xs" weight="semibold" color="secondary" hint-size="120px,18px">{{ p.name }}</dc-import>
</span>
</sc-for>
</div>
<div style="position:relative;flex:1;min-height:0">
<div class="rlScroll" id="mgPipe" style="position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;padding:0 12px 22px;margin:0 -12px">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
<a class="rlRow" style="display:grid;grid-template-columns:44px 14px minmax(0,1fr);gap:11px;align-items:center;height:62px;padding:0 12px;border-bottom:1px solid #F1F3F5;background:{{ r.rowBg }}">
<div style="text-align:center">
<dc-import name="Body" as="div" size="xs" weight="bold" tabular="{{ true }}" sx="color:{{ r.dateColor }}" hint-size="120px,18px">{{ r.date }}</dc-import>
<dc-import name="Body" as="div" size="xs" weight="semibold" sx="margin-top:1px;color:{{ r.dowColor }}" hint-size="120px,18px">{{ r.dow }}</dc-import>
</div>
<div style="position:relative;height:100%;display:grid;place-items:center">
<span style="position:absolute;top:0;bottom:0;width:1px;background:#F1F3F5"></span>
<span style="position:relative;width:{{ r.dotSize }};height:{{ r.dotSize }};border-radius:999px;background:{{ r.stageColor }};outline:3px solid #FFFFFF"></span>
</div>
<div style="min-width:0">
<div style="display:flex;align-items:center;gap:6px;min-width:0">
<dc-import name="Body" as="span" size="xs" weight="bold" color="secondary" sx="flex:none;letter-spacing:.06em" hint-size="120px,18px">{{ r.stage }}</dc-import>
<span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" class="rlTitle"><dc-import name="Body" as="span" size="xs" weight="bold" hint-size="120px,18px">{{ r.title }}</dc-import></span>
</div>
<dc-import name="Body" as="div" size="xs" color="tertiary" sx="margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" hint-size="120px,18px">{{ r.by }} · {{ r.where }}</dc-import>
<div style="margin-top:5px;display:flex;align-items:center;gap:7px">
<sc-for list="{{ r.counts }}" as="k" hint-placeholder-count="2">
<span style="display:flex;align-items:center;gap:4px">
<span style="width:5px;height:5px;background:{{ k.color }}"></span>
<dc-import name="Body" as="span" size="xs" weight="semibold" color="secondary" hint-size="120px,18px">{{ k.text }}</dc-import>
</span>
</sc-for>
</div>
</div>
</a>
</sc-for>
</div>
<div style="position:absolute;left:0;right:0;top:0;height:18px;pointer-events:none;background:linear-gradient(180deg,#FFFFFF,rgba(255,255,255,0))"></div>
<div style="position:absolute;left:0;right:0;bottom:0;height:26px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0),#FFFFFF 62%)"></div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:372,&quot;height&quot;:412},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;출시 일정&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stages&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Stage[]&quot;},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;PipelineRow[]&quot;},&quot;onReset&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
