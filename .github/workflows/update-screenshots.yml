# 화면 캡처 기준 그림(리눅스)을 만들거나 갱신해 브랜치에 커밋한다.
# 새 이야기를 추가했거나 화면을 일부러 바꿨을 때 실행: Actions → update-screenshots → 브랜치 선택.
# (기준 그림은 OS 마다 글꼴 렌더링이 달라 CI 와 같은 리눅스에서만 만든다 — .storybook/vitest.visual.ts)
name: update-screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 기준 그림 만들기 · 갱신
        run: npx vitest --run --project storybook --update
        working-directory: apps/web
      - name: 바뀐 기준 그림 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 'apps/web/**/__screenshots__/**'
          if git diff --cached --quiet; then echo "바뀐 기준 그림 없음"; exit 0; fi
          git commit -m "test: 화면 캡처 기준 그림 갱신 (리눅스)"
          git push
