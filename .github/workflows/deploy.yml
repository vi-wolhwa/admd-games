# 운영 자동 배포(ADR 0013): main 에 들어온 커밋 = develop → main '내보내기' PR 병합 = 배포 승인.
# 순서: 출처 확인 → 원격 D1 이관 → 배포 → 자동 점검 → 실패 시 이전 버전으로 되돌리기.
# 주의: DB 이관은 코드 되돌리기로 되돌아가지 않는다 — 이관은 항상 이전 코드와도 맞게(더하기만) 쓴다(docs/operations.md).
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: 출처 확인 · 배포할지 판단
        id: gate
        run: node scripts/deploy-gate.mjs production
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.go == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - name: 빌드
        if: steps.gate.outputs.go == 'true'
        run: npm run build
      - name: 운영 D1 이관
        if: steps.gate.outputs.go == 'true'
        working-directory: apps/web
        run: npx wrangler d1 migrations apply DB --remote
      - name: 배포
        id: deploy
        if: steps.gate.outputs.go == 'true'
        working-directory: apps/web
        run: |
          npx wrangler deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      - name: 자동 점검
        if: steps.gate.outputs.go == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/smoke-check.mjs
      - name: 실패 시 되돌리기
        if: failure() && steps.deploy.outcome == 'success'
        working-directory: apps/web
        run: |
          npx wrangler rollback --message "자동 점검 실패 — ${GITHUB_SHA::7}"
          gh issue create --title "운영 배포 되돌림: ${GITHUB_SHA::7}" --label 환경 --body "자동 점검이 실패해 이전 버전으로 되돌렸습니다. 실행 로그: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
