# Cloudflare 첫 설정(한 번만): 운영 · 미리보기 D1 을 만들고 ID 를 요약에 보여 준다.
# 그 ID 를 apps/web/wrangler.jsonc 에 넣는 PR 은 Claude 가 만든다. 이미 있으면 기존 ID 를 보여 줌.
# 필요한 시크릿: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (docs/operations.md)
name: cloudflare-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: D1 만들기(없으면) · ID 확인
        working-directory: apps/web
        run: node ../../scripts/cf-bootstrap.mjs
