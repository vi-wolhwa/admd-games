# 의존성 업데이트 (docs/dev/setup-agenda.md 6-6)
# - 보안 업데이트: 저장소 설정의 Dependabot security updates 로 즉시 (이 파일과 별개)
# - 일반 업데이트: 한 달에 한 번, minor · patch 를 PR 하나로 묶음, 공개 7일 뒤부터(.npmrc min-release-age 와 맞춤)
# - 메이저: 자동 PR 없음 → 나오면 이슈 하나로 계획해서 작업
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      all-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
